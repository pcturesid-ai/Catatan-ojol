<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Catatan Ojol</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a' },
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- Layar masuk / daftar -->
  <section id="auth-screen" class="hidden min-h-screen flex flex-col justify-center px-6 py-10 max-w-md mx-auto">
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-brand-700 flex items-center justify-center text-3xl shadow-lg">🛵</div>
      <h1 class="mt-4 text-2xl font-extrabold text-slate-900">Catatan Ojol</h1>
      <p class="text-sm text-slate-500 mt-1">Kelola keuangan ojolmu dari mana saja</p>
    </div>
    <form id="auth-form" class="space-y-4" autocomplete="on">
      <div id="auth-name-wrap" class="hidden">
        <label for="auth-name" class="block text-sm font-medium mb-1">Nama lengkap</label>
        <input id="auth-name" type="text" maxlength="60" autocomplete="name" class="field" placeholder="Nama kamu" />
      </div>
      <div>
        <label for="auth-email" class="block text-sm font-medium mb-1">Email</label>
        <input id="auth-email" type="email" required autocomplete="email" class="field" placeholder="nama@email.com" />
      </div>
      <div>
        <label for="auth-pass" class="block text-sm font-medium mb-1">Kata sandi</label>
        <input id="auth-pass" type="password" required minlength="6" autocomplete="current-password" class="field" placeholder="Minimal 6 karakter" />
      </div>
      <p id="auth-msg" class="text-sm min-h-[1.25rem]" role="status"></p>
      <button id="auth-submit" type="submit" class="btn-primary w-full">Masuk</button>
      <button id="auth-toggle" type="button" class="w-full text-sm text-brand-700 font-medium py-2">Belum punya akun? Daftar</button>
    </form>
  </section>

  <!-- Aplikasi utama -->
  <div id="app" class="hidden max-w-md mx-auto min-h-screen relative pb-28">
    <header class="px-5 pt-[calc(env(safe-area-inset-top)+1.25rem)] pb-6 bg-brand-700 text-white rounded-b-3xl">
      <div class="flex items-center gap-3">
        <button id="hdr-back" class="hidden w-9 h-9 -ml-2 rounded-full bg-white/15 text-xl leading-none" aria-label="Kembali">←</button>
        <div class="min-w-0">
          <p id="hdr-sub" class="text-sm text-brand-100 truncate"></p>
          <h1 id="hdr-title" class="text-xl font-bold truncate"></h1>
        </div>
      </div>
    </header>

    <main id="view" class="px-4 -mt-3 space-y-4"></main>

    <button id="fab" aria-label="Catat transaksi" class="fixed z-30 bottom-[calc(env(safe-area-inset-bottom)+5.5rem)] right-5 w-14 h-14 rounded-full bg-amber-500 text-white text-3xl font-light shadow-xl active:scale-95 transition">+</button>

    <nav class="fixed bottom-0 inset-x-0 z-20 bg-white border-t border-slate-200 pb-[env(safe-area-inset-bottom)]">
      <div class="max-w-md mx-auto grid grid-cols-4">
        <button data-tab="home" class="tab-btn"><span class="text-xl">🏠</span><span>Beranda</span></button>
        <button data-tab="history" class="tab-btn"><span class="text-xl">🧾</span><span>Riwayat</span></button>
        <button data-tab="analytics" class="tab-btn"><span class="text-xl">📊</span><span>Analitik</span></button>
        <button data-tab="account" class="tab-btn"><span class="text-xl">👤</span><span>Akun</span></button>
      </div>
    </nav>
  </div>

  <!-- Lembar bawah untuk form -->
  <div id="sheet" class="hidden fixed inset-0 z-40">
    <div id="sheet-backdrop" class="absolute inset-0 bg-black/40"></div>
    <div id="sheet-body" class="absolute bottom-0 inset-x-0 max-w-md mx-auto bg-white rounded-t-3xl p-5 pb-[calc(env(safe-area-inset-bottom)+1.25rem)] max-h-[92vh] overflow-y-auto"></div>
  </div>

  <div id="toast" class="hidden fixed z-50 left-1/2 -translate-x-1/2 bottom-28 max-w-[90vw] text-center bg-slate-900 text-white text-sm px-4 py-2 rounded-2xl shadow-lg"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
